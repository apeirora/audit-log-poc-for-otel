# Sidecar: SQLite queue in front of the failover connector.
# otlphttp/queue persists, then posts to the local dispatch receiver.
# The exporters under failover have no queue and no retry.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  db_storage:
    driver: sqlite
    datasource: "file:///var/lib/otel/queue/queue.db?_pragma=busy_timeout(10000)&_pragma=journal_mode(WAL)&_pragma=synchronous(FULL)"

receivers:
  otlp/in:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
  otlp/dispatch:
    protocols:
      http:
        endpoint: 127.0.0.1:14318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16

exporters:
  otlphttp/queue:
    endpoint: http://127.0.0.1:14318
    encoding: json
    compression: none
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      storage: db_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlphttp/main:
    endpoint: http://toxic:4417
    encoding: json
    compression: none
    timeout: 2s
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
  otlphttp/secondary:
    endpoint: http://toxic:4418
    encoding: json
    compression: none
    timeout: 2s
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

connectors:
  failover:
    priority_levels:
      - [logs/main]
      - [logs/secondary]
    retry_interval: 15s

service:
  extensions: [health_check, db_storage]
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [otlp/in]
      processors: [memory_limiter]
      exporters: [otlphttp/queue]
    logs/dispatch:
      receivers: [otlp/dispatch]
      exporters: [failover]
    logs/main:
      receivers: [failover]
      exporters: [otlphttp/main]
    logs/secondary:
      receivers: [failover]
      exporters: [otlphttp/secondary]
